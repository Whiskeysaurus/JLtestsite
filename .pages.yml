media:
  input: assets/uploads
  output: uploads
  rename: safe

content:
  - name: events
    label: Events
    type: collection
    path: content/events
    filename: "{fields.title}.md"
    exclude: ["_index.md"]
    view:
      fields: [title, date, location]
      sort: [date]
    fields:
      - { name: title,        label: Event name,   type: string, required: true }
      - { name: date,         label: Date,         type: date,   required: true }
      - { name: location,     label: Location,     type: string }
      - { name: summary,      label: Card blurb,   type: text,   description: "One or two lines. Shown on the events list and the homepage." }
      - { name: featureImage, label: Photo,        type: image }
      - { name: body,         label: Full details, type: rich-text }

  - name: people
    label: People
    type: collection
    path: content/people
    filename: "{fields.title}.md"
    exclude: ["_index.md"]
    view:
      fields: [title, role, weight]
      sort: [weight]
    fields:
      - { name: title,        label: Name,         type: string, required: true }
      - { name: role,         label: Role,         type: string }
      - { name: weight,       label: Order on page, type: number, default: 100, description: "Lower numbers appear first." }
      - { name: summary,      label: Card blurb,   type: text,   description: "One or two lines. Shown on the people list." }
      - { name: featureImage, label: Photo,        type: image }
      - { name: body,         label: Full bio,     type: rich-text }

  - name: about
    label: About page
    type: file
    path: content/about.md
    fields:
      - { name: title,        label: Section heading, type: string, required: true }
      - { name: address,      label: Address lines,   type: string, list: true, description: "One line per entry. Shown to the right of the about text." }
      - { name: contactLabel, label: Contact button text, type: string }
      - { name: contactUrl,   label: Contact button link, type: string, description: "Where the CONTACT button goes, e.g. mailto:someone@mit.edu. Leave empty and the button is shown but not clickable." }
      - { name: body,         label: About text,      type: rich-text }
