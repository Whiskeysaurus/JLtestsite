{{ define "main" }}
<h1>{{ .Title }}</h1>
<div class="people-grid">
  {{ range .Pages }}
  <a class="person-card" href="{{ .RelPermalink }}">
    {{ with .Params.photo }}<img src="{{ . }}" alt="">{{ end }}
    <h3>{{ .Title }}</h3>
    <p class="role">{{ .Params.role }}</p>
    <p class="blurb">{{ .Params.blurb }}</p>
  </a>
  {{ end }}
</div>
{{ end }}
